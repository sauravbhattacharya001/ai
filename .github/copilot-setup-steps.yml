name: Copilot Setup Steps
description: Install dependencies and build the project for GitHub Copilot coding agents

on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mkdocs-material 'mkdocstrings[python]' pymdown-extensions

      - name: Verify package installation
        run: |
          python -c "from replication import Controller, Worker, ReplicationContract; print('core imports OK')"
          python -c "from replication.alignment import AlignmentAuditor; print('alignment OK')"
          python -c "from replication.forensics import ForensicsEngine; print('forensics OK')"
          python -c "from replication.fleet import FleetManager; print('fleet OK')"
          python -c "from replication.supply_chain import SupplyChainAnalyzer; print('supply_chain OK')"
          python -c "from replication.drift import DriftTracker; print('drift OK')"
          python -c "import replication.remediation_planner, replication.remediation_progress, replication.remediation_assignment, replication.remediation_roi, replication.safety_debt, replication.finding_triage, replication.kill_switch_tuner, replication.defense_layer_redundancy_advisor; print('remediation advisors OK')"
          python -c "import replication.cognitive_sabotage, replication.wireheading, replication.treacherous_turn, replication.sleeper_agent, replication.mesa_optimizer, replication.capability_overhang, replication.emergent_coalition; print('alignment detectors OK')"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Type check
        run: python -m mypy src/replication/ --ignore-missing-imports || true

      - name: Lint
        run: python -m flake8 src/replication/ --max-line-length=120 --count --show-source --statistics || true

      - name: Docs build (strict)
        run: mkdocs build --strict
